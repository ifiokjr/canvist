# SwiftLint lints every Swift file that ships canvist: the editor package,
# its tests, and the sample apps. Vendored and generated trees (the Example
# project's Pods, build output, generated UI tests) are excluded, mirroring
# the `excludes` in dprint.json.
#
# Formatting is owned by swift-format (`.swift-format`, run through dprint), so
# style rules that fight the formatter are disabled here; SwiftLint focuses on
# correctness and conventions.

included:
  - platforms/apple
  - examples/react-native
  - packages/canvist-react-native

excluded:
  - platforms/apple/.build
  - platforms/apple/Frameworks
  - platforms/apple/Example/Pods
  - examples/react-native/ios/Pods
  - "**/build"
  # Generated by the Rust extension metadata (`Extensions.generated.swift`).
  - "**/*.generated.swift"

line_length:
  warning: 120
  error: 200
  ignores_comments: true

identifier_name:
  min_length:
    warning: 1
    error: 0
  excluded:
    - id
    - x
    - y
    - dx
    - dy

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 80
  error: 160

cyclomatic_complexity:
  warning: 20
  error: 35

# Rules that duplicate or contradict the formatter's decisions.
disabled_rules:
  - trailing_comma
  - opening_brace
  - vertical_whitespace
  - todo
  - file_length
  - type_name
  # The text-editing APIs pass structured position/state tuples.
  - large_tuple
