name: canvist
description: canvist's document model and editing engine in pure Dart (no Flutter), built from Rust by a build hook. Convert ProseMirror JSON, HTML, and Markdown, run typed commands, and serve Yjs collaboration.
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.1.0
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
