name: canvist_flutter_example
description: Sample app that drives the canvist Rust core from Flutter.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  canvist_flutter:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
