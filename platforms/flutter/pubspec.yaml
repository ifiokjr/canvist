name: canvist_flutter
description: Flutter binding for canvist. The engine comes from the pure Dart `canvist` package, whose build hook compiles the Rust core; Flutter widgets belong here.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  canvist:
    path: ../dart
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
