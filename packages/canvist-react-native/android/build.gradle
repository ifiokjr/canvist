// The React Native glue for canvist's Android editor (`io.github.ifiokjr:canvist-android`).
import groovy.json.JsonSlurper

buildscript {
  ext.getExtOrDefault = { name, fallback ->
    rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion', '2.2.0')}"
  }
}

apply plugin: "com.android.library"
if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}
apply plugin: "com.facebook.react"

// The editor is released in step with this package, so they share a version.
def canvistVersion = new JsonSlurper().parse(file("../package.json")).version

android {
  namespace "io.github.ifiokjr.canvist.reactnative"
  compileSdkVersion getExtOrDefault("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion", 24)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main.java.srcDirs += "src/main/kotlin"
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "io.github.ifiokjr:canvist-android:${canvistVersion}"
}
