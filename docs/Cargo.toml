[package]
name = "canvist_book"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "The canvist docs, with their Rust samples run as doc tests"

[dev-dependencies]
canvist = { workspace = true, features = ["collab", "ssr"] }
canvist_desktop = { workspace = true }
# By path, not the workspace version table: the testkit ships nowhere, so
# no release bump should ever have to touch its version requirement.
canvist_testkit = { path = "../crates/canvist_testkit", features = ["collab"] }
serde_json = { workspace = true, features = ["std"] }
# The testkit's `cross_test!` expands to `#[tokio::test]`.
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
