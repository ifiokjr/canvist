# Type into the native editor, format from the JavaScript toolbar, and read
# the document back through the typed API.
appId: dev.canvist.example
name: Editing
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "33 words"
    timeout: 30000
# Below the text: the caret lands at the end of the last checklist item, which
# is short enough to end left of the tap, and Enter starts a new one.
- tapOn:
    id: "editor"
# Keys sent before the keyboard has connected are dropped.
- waitForAnimationToEnd
- pressKey: Enter
- inputText: "today"
- pressKey: Enter
- assertVisible: "34 words"
- tapOn:
    id: "tool-Bold"
- assertVisible:
    id: "tool-Bold"
    selected: true
- inputText: "loud"
- tapOn:
    id: "footer-Markdown"
- assertVisible:
    id: "markdown"
    text: "(?s).*- \\[ \\] today\\n- \\[ \\] \\*\\*loud\\*\\*.*"
- tapOn:
    id: "tool-Undo"
- assertNotVisible:
    text: "(?s).*\\*\\*loud\\*\\*.*"
