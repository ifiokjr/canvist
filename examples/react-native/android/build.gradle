buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// `@canvist/react-native` depends on `io.github.ifiokjr:canvist-android`. In
// this repository it comes from Maven Local, published from `platforms/android`
// (`./gradlew :canvist:publishToMavenLocal`), so the example runs against the
// editor in the same checkout.
allprojects {
    repositories {
        mavenLocal {
            content { includeGroup("io.github.ifiokjr") }
        }
    }
}
