# The iOS app that hosts the Lynx example: `xcodegen generate`, then
# `pod install` (e2e/test.sh does both).
name: CanvistLynxExample
options:
  bundleIdPrefix: dev.canvist
  deploymentTarget:
    iOS: "17.0"
targets:
  CanvistLynxExample:
    type: application
    platform: iOS
    sources:
      - CanvistLynxExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.canvist.lynx.example
        INFOPLIST_FILE: CanvistLynxExample/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: CanvistLynxExample/Bridging-Header.h
        SWIFT_VERSION: "6.0"
        # Lynx's pods run build scripts that the sandbox would block.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGNING_ALLOWED: NO
