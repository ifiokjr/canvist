[package]
name = "canvist_layout"
version.workspace = true
authors.workspace = true
categories.workspace = true
documentation = "https://docs.rs/canvist_layout"
edition.workspace = true
homepage.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "readme.md", "license"]
keywords = ["text-layout", "rich-text", "line-breaking", "bidi", "canvas"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Incremental text and block layout for the canvist editor: line breaking, bidi, hit testing, display lists, and SVG/HTML renderers"

[dependencies]
canvist_editor = { workspace = true, optional = true }
canvist_model = { workspace = true }
icu_segmenter = { version = "^2.3", default-features = false, features = ["compiled_data"] }
parley = { version = "^0.12", default-features = false, features = ["std"], optional = true }
rustc-hash = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
unicode-bidi = { version = "^0.3", default-features = false, features = ["hardcoded-data", "std"] }
unicode-segmentation = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }

[[bench]]
name = "layout"
harness = false

[features]
default = ["theme-extensions"]
# StarterKit theme rules for blocks, marks, and embeds beyond the
# StarterKit. Without it a host whose schema has none of them carries
# none of their styles.
theme-extensions = []
editor = ["dep:canvist_editor"]
parley = ["dep:parley"]

[lints]
workspace = true
