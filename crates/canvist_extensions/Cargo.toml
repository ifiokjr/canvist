[package]
name = "canvist_extensions"
version.workspace = true
authors.workspace = true
categories.workspace = true
documentation = "https://docs.rs/canvist_extensions"
edition.workspace = true
homepage.workspace = true
include.workspace = true
keywords = ["text-editor", "rich-text", "editor", "extensions"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "canvist extensions: the TipTap StarterKit and Remirror and TipTap extensions beyond it, each behind its own Cargo feature"

[features]
default = ["starter-kit"]
starter-kit = [
	"blockquote",
	"clipboard",
	"bold",
	"bullet-list",
	"code",
	"code-block",
	"hard-break",
	"heading",
	"history",
	"horizontal-rule",
	"italic",
	"link",
	"ordered-list",
	"strike",
	"task-list",
	"trailing-node",
	"underline",
]
# Every extension in the crate.
full = [
	"starter-kit",
	"character-count",
	"highlight",
	"placeholder",
	"subscript",
	"superscript",
	"text-align",
	"text-style-kit",
	"typography",
]
# TipTap's TextStyleKit: the `textStyle` mark and every attribute on it.
text-style-kit = [
	"background-color",
	"color",
	"font-family",
	"font-size",
	"line-height",
	"text-style",
]
background-color = ["text-style"]
blockquote = []
bold = []
bullet-list = ["list-item"]
character-count = ["dep:unicode-segmentation"]
clipboard = []
code = []
code-block = []
color = ["text-style"]
font-family = ["text-style"]
font-size = ["text-style"]
hard-break = []
heading = []
highlight = []
history = []
horizontal-rule = []
italic = []
line-height = ["text-style"]
link = []
list-item = []
ordered-list = ["list-item"]
placeholder = []
strike = []
subscript = []
superscript = []
task-list = []
text-align = []
text-style = []
trailing-node = []
typography = []
underline = []

[dependencies]
canvist_editor = { workspace = true }
canvist_model = { workspace = true }
unicode-segmentation = { workspace = true, optional = true }

[dev-dependencies]
divan = { workspace = true }
insta = { workspace = true, features = ["json"] }
proptest = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }

[[bench]]
name = "keystroke"
harness = false

[[bench]]
name = "extensions"
harness = false
required-features = ["full"]

[lints]
workspace = true
