# Configuration for cargo-deny
# See https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true
exclude = ["canvist_book"]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
	# `smallstr` is unmaintained; it is a dependency of `yrs` (still in 0.28) with no maintained
	# replacement upstream. Informational only, no known vulnerability.
	{ id = "RUSTSEC-2026-0215", reason = "transitive via yrs, no upstream alternative yet" },
	# `ttf-parser` is unmaintained; it enters through `ab_glyph` in `sctk-adwaita`, the Wayland
	# window decorations of winit, which `canvist_desktop` uses on Linux.
	# Informational only, no known vulnerability.
	{ id = "RUSTSEC-2026-0192", reason = "transitive via sctk-adwaita in winit, no upstream alternative yet" },
	# `basic-toml` is unmaintained; it enters through `askama`, the template engine of
	# `uniffi_bindgen` (both already at their latest), which only generates the Swift and
	# Kotlin bindings at build time.
	{ id = "RUSTSEC-2026-0374", reason = "transitive via askama in uniffi_bindgen, build-time only, no upstream alternative yet" },
	# `zvariant`, `zvariant_derive`, and `zbus_names` moved into `zbus` 6. They enter through
	# zbus 5 in AccessKit's Linux adapter (`accesskit_unix`, already at its latest), which
	# `canvist_desktop` uses for screen readers on Linux. Informational only, no known
	# vulnerability.
	{ id = "RUSTSEC-2026-0370", reason = "transitive via zbus 5 in accesskit_unix, no newer AccessKit yet" },
	{ id = "RUSTSEC-2026-0371", reason = "transitive via zbus 5 in accesskit_unix, no newer AccessKit yet" },
	{ id = "RUSTSEC-2026-0372", reason = "transitive via zbus 5 in accesskit_unix, no newer AccessKit yet" },
]

[licenses]
allow = [
	"MIT",
	"Apache-2.0",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Unlicense",
	"Zlib",
	"Unicode-3.0",
	"BSL-1.0",
	"CC0-1.0",
	"MIT-0",
	"MPL-2.0",
	"Unicode-DFS-2016",
	"OpenSSL",
	# webpki-roots ships Mozilla's CC-licensed root certificate list; the
	# testkit's Playwright connection reads it.
	"CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
