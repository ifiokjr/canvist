name: playwright browsers
description: >-
  Install Playwright browsers with a cache and retries. Browser downloads and
  their apt dependencies have stalled CI runners for the full step timeout, so
  the browsers are cached per runner OS and Playwright version, and both the
  downloads and the system package installs are capped and retried, with a
  fallback from the runner's Azure apt mirror to the canonical Ubuntu archive.
inputs:
  browsers:
    description: Space-separated browsers to install, such as `chromium firefox`.
    required: true
  command:
    description: >-
      The Playwright CLI to run, without arguments. Defaults to `npx playwright`;
      pass `node node_modules/@playwright/test/cli.js` where npx is unavailable.
    required: false
    default: npx playwright
  working-directory:
    description: Where `command` resolves Playwright from.
    required: false
    default: .
  with-deps:
    description: Also install the browsers' system packages (Linux only).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: read the playwright version
      id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        version=$(${{ inputs.command }} --version | awk '{print $NF}')
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: cache the browsers
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ms-playwright
          ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}-${{ inputs.browsers }}

    # Ubuntu's apt mirrors have hung `apt-get update` for the step timeout
    # and crawled at ~100 KiB/s for hours, and WebKit's GTK4 and GStreamer
    # packages are not on the runner image, so deps that do not install fail
    # that browser's tests with Playwright's own "missing dependencies"
    # error. Up to three capped attempts: apt keeps every fully downloaded
    # package in /var/cache/apt/archives, so a later attempt resumes instead
    # of restarting, and after the first timeout the Azure mirror the runner
    # ships with is swapped for the canonical Ubuntu archive. The timeout
    # kills the Playwright CLI's whole process group, but sudo (use_pty on
    # the runner images) runs apt-get in a session of its own that survives
    # it still holding the dpkg lock, so each retry kills any leftover
    # apt-get and runs `dpkg --configure -a` to finish a package caught
    # mid-unpack. If no attempt finishes, the job still goes on with the
    # runner image's packages.
    - name: install the system packages
      if: inputs.with-deps == 'true' && runner.os == 'Linux'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -uo pipefail
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' |
          sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
        for attempt in 1 2 3; do
          # shellcheck disable=SC2086 # `command` and `browsers` split into words
          if perl -e '
            my $seconds = shift;
            my $pid = fork() // die "fork: $!";
            if ($pid == 0) { setpgrp(0, 0); exec @ARGV or die "exec: $!" }
            $SIG{ALRM} = sub { kill "-TERM", $pid; sleep 5; kill "-KILL", $pid; exit 124 };
            alarm $seconds;
            waitpid($pid, 0);
            exit($? >> 8);
          ' 360 ${{ inputs.command }} install-deps ${{ inputs.browsers }}; then
            exit 0
          fi
          echo "::warning::playwright install-deps attempt $attempt failed"
          sudo pkill -KILL -x apt-get >/dev/null 2>&1 || true
          sudo dpkg --configure -a >/dev/null 2>&1 || true
          if [ "$attempt" -eq 1 ]; then
            sudo grep -rl 'azure.archive.ubuntu.com' /etc/apt/sources.list /etc/apt/sources.list.d/ /etc/apt/apt-mirrors.txt 2>/dev/null |
              sudo xargs -r sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g'
          fi
          sleep $((attempt * 15))
        done
        echo "::warning::playwright install-deps did not finish; relying on the runner image's packages"

    # Up to three attempts of five minutes each, so a stalled download is
    # retried instead of holding the job for its whole timeout. The attempt
    # runs in its own process group, which a timeout kills whole; macOS
    # runners have no `timeout`, so `perl` keeps the clock.
    - name: install the browsers
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -uo pipefail
        for attempt in 1 2 3; do
          # shellcheck disable=SC2086 # `command` and `browsers` split into words
          if perl -e '
            my $seconds = shift;
            my $pid = fork() // die "fork: $!";
            if ($pid == 0) { setpgrp(0, 0); exec @ARGV or die "exec: $!" }
            $SIG{ALRM} = sub { kill "-TERM", $pid; sleep 5; kill "-KILL", $pid; exit 124 };
            alarm $seconds;
            waitpid($pid, 0);
            exit($? >> 8);
          ' 300 ${{ inputs.command }} install ${{ inputs.browsers }}; then
            exit 0
          fi
          echo "::warning::playwright install attempt $attempt failed; retrying"
          sleep $((attempt * 15))
        done
        echo "::error::playwright install failed after 3 attempts"
        exit 1
