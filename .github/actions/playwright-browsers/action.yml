name: playwright browsers
description: >-
  Install Playwright browsers with a cache and retries. Browser downloads and
  their apt dependencies have stalled CI runners for the full step timeout, so
  the system packages are best effort, the browsers are cached per runner OS
  and Playwright version, and each download attempt is retried.
inputs:
  browsers:
    description: Space-separated browsers to install, such as `chromium firefox`.
    required: true
  command:
    description: >-
      The Playwright CLI to run, without arguments. Defaults to `npx playwright`;
      pass `node node_modules/@playwright/test/cli.js` where npx is unavailable.
    required: false
    default: npx playwright
  working-directory:
    description: Where `command` resolves Playwright from.
    required: false
    default: .
  with-deps:
    description: Also install the browsers' system packages (Linux only).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: read the playwright version
      id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        version=$(${{ inputs.command }} --version | awk '{print $NF}')
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: cache the browsers
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ms-playwright
          ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}-${{ inputs.browsers }}

    # Ubuntu's apt mirrors have hung `apt-get update` for the whole step
    # timeout. The runner images already carry most of what the browsers need,
    # so this is best effort: one attempt, capped at six minutes, with short
    # per-fetch timeouts. If it doesn't finish, the job goes on, and a browser
    # that really lacks a library fails its tests with Playwright's own
    # "missing dependencies" error. apt runs only once, so a capped attempt
    # can't leave the dpkg lock held for a later one.
    - name: install the system packages
      if: inputs.with-deps == 'true' && runner.os == 'Linux'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -uo pipefail
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' |
          sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
        # shellcheck disable=SC2086 # `command` and `browsers` split into words
        if ! perl -e '
          my $seconds = shift;
          my $pid = fork() // die "fork: $!";
          if ($pid == 0) { setpgrp(0, 0); exec @ARGV or die "exec: $!" }
          $SIG{ALRM} = sub { kill "-TERM", $pid; sleep 5; kill "-KILL", $pid; exit 124 };
          alarm $seconds;
          waitpid($pid, 0);
          exit($? >> 8);
        ' 360 ${{ inputs.command }} install-deps ${{ inputs.browsers }}; then
          echo "::warning::playwright install-deps did not finish; relying on the runner image's packages"
        fi

    # Up to three attempts of five minutes each, so a stalled download is
    # retried instead of holding the job for its whole timeout. The attempt
    # runs in its own process group, which a timeout kills whole; macOS
    # runners have no `timeout`, so `perl` keeps the clock.
    - name: install the browsers
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -uo pipefail
        for attempt in 1 2 3; do
          # shellcheck disable=SC2086 # `command` and `browsers` split into words
          if perl -e '
            my $seconds = shift;
            my $pid = fork() // die "fork: $!";
            if ($pid == 0) { setpgrp(0, 0); exec @ARGV or die "exec: $!" }
            $SIG{ALRM} = sub { kill "-TERM", $pid; sleep 5; kill "-KILL", $pid; exit 124 };
            alarm $seconds;
            waitpid($pid, 0);
            exit($? >> 8);
          ' 300 ${{ inputs.command }} install ${{ inputs.browsers }}; then
            exit 0
          fi
          echo "::warning::playwright install attempt $attempt failed; retrying"
          sleep $((attempt * 15))
        done
        echo "::error::playwright install failed after 3 attempts"
        exit 1
