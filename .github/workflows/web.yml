name: "web"
permissions:
  contents: read
on:
  # Dispatched by hand on the release pull request: GITHUB_TOKEN opens it,
  # and GitHub starts no pull_request workflows for that.
  workflow_dispatch:
  push:
    branches:
      - main
  # Every pull request, including stacked ones whose base is another
  # feature branch.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Build @canvist/web, type-check it, and run its unit tests. Its bundle size
  # is the `bench / bundle size` check (`bench-size.yml`).
  check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: install rust toolchain and the wasm target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: cache rust
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # @canvist/web reads its extension types from @canvist/headless.
      - name: build @canvist/headless
        working-directory: packages/canvist-headless
        run: |
          npm ci
          npm run build:wasm
          npm run build

      - name: install dependencies
        working-directory: packages/canvist-web
        run: npm ci

      - name: build wasm
        working-directory: packages/canvist-web
        run: npm run build:wasm

      - name: type-check
        working-directory: packages/canvist-web
        run: npx tsc --noEmit

      - name: unit tests
        working-directory: packages/canvist-web
        run: npm test

  # Pixel parity between the canvas editor and the server-rendered HTML it
  # hydrates from, in every engine on both desktop platforms. Each run
  # uploads a side-by-side report (canvas | DOM | difference).
  # The examples in `examples/web`: a plain page, React, Vue, and a page
  # rendered by canvist's Rust renderer that the editor hydrates.
  examples:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: install rust toolchain and the wasm target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: cache rust
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: build @canvist/headless
        working-directory: packages/canvist-headless
        run: |
          npm ci
          npm run build:wasm
          npm run build

      - name: build @canvist/web
        working-directory: packages/canvist-web
        run: |
          npm ci
          npm run build:wasm
          npm run build

      - name: build and type-check @canvist/react and @canvist/vue
        run: |
          for package in canvist-react canvist-vue; do
            (cd "packages/$package" && npm ci && npx tsc --noEmit && npm run build)
          done

      - name: render the server-rendered example
        working-directory: examples/web
        run: npm run ssr

      - name: install dependencies
        working-directory: examples/web
        run: npm ci

      - name: type-check the examples
        working-directory: examples/web
        run: npx tsc --noEmit

      - name: install browsers
        working-directory: examples/web
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium firefox webkit

      - name: test the examples
        working-directory: examples/web
        run: npx playwright test

  parity:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        browser:
          - chromium
          - firefox
          - webkit
    runs-on: ${{ matrix.os }}
    env:
      CANVIST_BROWSERS: ${{ matrix.browser }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: install rust toolchain and the wasm target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: cache rust
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # @canvist/web reads its extension types from @canvist/headless.
      - name: build @canvist/headless
        working-directory: packages/canvist-headless
        run: |
          npm ci
          npm run build:wasm
          npm run build

      - name: install dependencies
        working-directory: packages/canvist-web
        run: npm ci

      - name: build wasm
        working-directory: packages/canvist-web
        run: npm run build:wasm

      - name: install the browser
        working-directory: packages/canvist-web
        timeout-minutes: 10
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: pixel parity, editing, and input latency
        working-directory: packages/canvist-web
        run: npx playwright test

      - name: parity report
        if: ${{ !cancelled() }}
        working-directory: packages/canvist-web
        run: |
          node scripts/parity-report.ts --inline
          {
            echo "## Pixel parity: ${{ matrix.browser }} on ${{ matrix.os }}"
            echo
            echo '```'
            node scripts/parity-report.ts | head -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: input latency
        if: ${{ !cancelled() }}
        working-directory: packages/canvist-web
        run: |
          {
            echo "## Input latency: ${{ matrix.browser }} on ${{ matrix.os }}"
            echo
            echo '```json'
            cat report/perf/*.json 2>/dev/null || echo "not measured"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.browser }}-${{ matrix.os }}
          path: |
            packages/canvist-web/report/parity/
            packages/canvist-web/report/perf/
          retention-days: 30
