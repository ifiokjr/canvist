name: "native"

# Builds the UniFFI/flutter_rust_bridge bindings and runs every native test on
# an iOS Simulator and an Android emulator.
#
# These jobs take 10-20 minutes, so pull requests only run them when they touch
# the native surface, and they are not required checks. Every push to `main`
# and a nightly run cover changes elsewhere (Rust core, toolchains, runner
# images) that could still break the native builds.
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/native.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/canvist_ffi/**"
      - "crates/canvist_headless/**"
      - "platforms/**"
      - "rust-toolchain.toml"
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  apple:
    name: ios (simulator)
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: native-apple

      - name: install xcodegen
        run: brew install xcodegen

      - name: setup flutter
        uses: kuhnroyal/flutter-fvm-config-action/setup@v3
        with:
          path: platforms/flutter/.fvmrc

      # Per-step timeouts make a hung simulator or emulator fail fast with logs
      # instead of running into the job timeout.
      - name: test swift package and sample app
        timeout-minutes: 25
        run: platforms/apple/test.sh

      - name: test flutter on ios
        timeout-minutes: 20
        run: platforms/flutter/test.sh
        env:
          CANVIST_FLUTTER_PLATFORMS: ios

      - name: upload xcresult
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: platforms/apple/.build/example.xcresult

  android:
    name: android (emulator)
    timeout-minutes: 60
    # Pinned: `ubuntu-latest` moves to 26.04 from 2026-10-19 and the emulator
    # setup (KVM, x86_64 image) is only verified on 24.04.
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: native-android

      - name: install cargo-run-bin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-run-bin

      - name: setup flutter
        uses: kuhnroyal/flutter-fvm-config-action/setup@v3
        with:
          path: platforms/flutter/.fvmrc

      - name: check flutter_rust_bridge bindings are up to date
        timeout-minutes: 15
        working-directory: platforms/dart
        run: |
          dart pub get
          cargo bin flutter_rust_bridge_codegen generate
          git diff --exit-code -- lib/src/rust rust/src

      - name: build android library
        timeout-minutes: 15
        run: platforms/android/build.sh

      - name: test on emulator
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect
          script: platforms/android/test.sh && CANVIST_FLUTTER_PLATFORMS=android platforms/flutter/test.sh
