name: "playwright"
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  playwright-linux:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: install playwright browser
        run: deno run -A npm:playwright@1.58 install --with-deps ${{ matrix.browser }}

      - name: run playwright tests
        run: |
          cd packages/canvist
          deno task test:playwright
        env:
          CI: "true"
          CI_BROWSERS: ${{ matrix.browser }}

  playwright-webkit:
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: cache rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: install wasm-pack
        run: cargo install wasm-pack --locked

      - name: install deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: build wasm
        run: wasm-pack build crates/canvist_wasm --target web --out-dir ../../packages/canvist/wasm

      - name: install playwright webkit
        run: deno run -A npm:playwright@1.58 install --with-deps webkit

      - name: run playwright tests
        run: |
          cd packages/canvist
          deno task test:playwright
        env:
          CI: "true"
          CI_BROWSERS: "webkit"
