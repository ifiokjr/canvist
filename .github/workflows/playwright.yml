name: "playwright"
permissions:
  contents: read
on:
  # Dispatched by hand on the release pull request: GITHUB_TOKEN opens it,
  # and GitHub starts no pull_request workflows for that.
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  playwright-linux:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # `deno run npm:playwright install` hangs on CI runners; npx installs the
      # same browser build into the shared ms-playwright cache that the deno tests use.
      - name: install playwright browser
        timeout-minutes: 10
        run: npx --yes playwright@1.58 install --with-deps ${{ matrix.browser }}

      - name: run playwright tests
        run: |
          cd packages/canvist
          deno task test:playwright
        env:
          CI: "true"
          CI_BROWSERS: ${{ matrix.browser }}

  playwright-webkit:
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: cache rust
        uses: Swatinem/rust-cache@v2

      - name: install wasm-pack
        run: cargo install wasm-pack --locked

      - name: install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: build wasm
        run: wasm-pack build crates/canvist_wasm --target web --out-dir ../../packages/canvist/wasm

      - name: install playwright webkit
        timeout-minutes: 10
        run: npx --yes playwright@1.58 install --with-deps webkit

      - name: run playwright tests
        run: |
          cd packages/canvist
          deno task test:playwright
        env:
          CI: "true"
          CI_BROWSERS: "webkit"
